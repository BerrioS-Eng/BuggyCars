serenity {
    take.screenshots = FOR_EACH_ACTION
    # Un navegador nuevo por escenario: la sesión de uno no afecta al siguiente (FIRST)
    use.unique.browser = false
    test.root = co.edu.udea.calidad.buggycars
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  # Espera hasta 5 s a que aparezcan los elementos antes de fallar
  timeouts.implicitlywait = 5000
  wait.for.timeout = 10000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --incognito;--disable-infobars,--disable-gpu;--remote-allow-origins=*"""

pages {
    buggyCars = "https://buggy.justtestit.org"
}